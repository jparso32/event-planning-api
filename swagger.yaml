openapi: 3.0.0
info:
  title: Event Planning API
  version: 1.0.0
  description: API documentation for Event Planning App

servers:
  - url: http://localhost:3000

tags:
  - name: Auth
  - name: Venues
  - name: Events
  - name: Invitations

paths:
  /api/auth/signup:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User created

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful

  /api/venues:
    get:
      tags:
        - Venues
      summary: Get venues
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of venues

    post:
      tags:
        - Venues
      summary: Create venue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
                city:
                  type: string
                state:
                  type: string
                capacity:
                  type: integer
      responses:
        '201':
          description: Venue created

  /api/events:
    get:
      tags:
        - Events
      summary: Get events
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of events

    post:
      tags:
        - Events
      summary: Create event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                venueId:
                  type: integer
                title:
                  type: string
                description:
                  type: string
                eventDate:
                  type: string
                startTime:
                  type: string
                endTime:
                  type: string
      responses:
        '201':
          description: Event created

  /api/invitations:
    get:
      tags:
        - Invitations
      summary: Get invitations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of invitations

    post:
      tags:
        - Invitations
      summary: Create invitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId:
                  type: integer
                guestName:
                  type: string
                guestEmail:
                  type: string
                rsvpStatus:
                  type: string
      responses:
        '201':
          description: Invitation created

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT